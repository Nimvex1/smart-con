name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: default

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Show Forge version
        run: forge --version

      - name: Build
        run: forge build

      - name: Unit tests
        run: forge test --match-path 'test/*.t.sol' --no-match-path 'test/*Invariant*.t.sol'

      - name: Formatting check
        run: forge fmt --check

      - name: Gas snapshot check
        # `.gas-snapshot` is generated on the maintainer's platform (Windows) and
        # compared here on Linux. Measured cross-platform delta is up to ~5% and is
        # consistently one-directional (Linux cheaper): memory expansion costs differ
        # by OS, and the effect is largest on allocation-heavy setup tests. A 1%
        # tolerance did not absorb it. 10% leaves margin over the measured 5.05% while
        # still catching the regressions this check exists for, which are orders of
        # magnitude, not single-digit percent.
        #
        # If this ever needs to be tighter, regenerate `.gas-snapshot` on the same
        # platform CI runs rather than shrinking the tolerance.
        run: forge snapshot --check --tolerance 10 --no-match-test "testFuzz_|invariant_"

  fuzz-and-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: High-run fuzz + invariant suite
        run: forge test --profile ci

  slither:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Slither analysis
        uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          target: .
          fail-on: none
          sarif: slither.sarif
          slither-args: --filter-paths lib

      - name: Upload SARIF (optional)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
